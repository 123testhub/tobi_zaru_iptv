<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advanced IPTV Portal</title>

<link rel="stylesheet" href="https://unpkg.com/plyr@3/dist/plyr.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:15px;
}

h1{
    text-align:center;
    margin-bottom:15px;
    color:#00bfff;
}

.player-container{
    max-width:1000px;
    margin:auto;
}

video{
    width:100%;
    border-radius:12px;
    background:#000;
}

.channel-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
    gap:10px;
    margin-top:20px;
}

.channel{
    background:#111;
    border:1px solid #222;
    border-radius:12px;
    padding:8px;
    text-align:center;
    cursor:pointer;
    transition:0.2s;
}

.channel:hover{
    transform:scale(1.05);
    border-color:#00bfff;
}

.channel img{
    width:70px;
    height:70px;
    border-radius:12px;
    object-fit:cover;
}

.channel-name{
    font-size:12px;
    margin-top:5px;
    color:#ccc;
}

.controls{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

button,input{
    padding:12px;
    border:none;
    border-radius:10px;
}

button{
    background:#00bfff;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:0.85;
}

input{
    flex:1;
    background:#111;
    color:white;
    border:1px solid #333;
}

.status{
    margin-top:10px;
    color:#aaa;
    font-size:14px;
}

</style>
</head>

<body>

<div class="player-container">

<h1>Advanced IPTV Portal</h1>

<video id="video" controls playsinline></video>

<div class="controls">

<input
id="customUrl"
placeholder="วางลิงก์ .m3u8 หรือ .mpd"
/>

<button onclick="loadCustom()">
เล่นเว็บ
</button>

<button onclick="openMX()">
MX Player
</button>

<button onclick="openWiseplay()">
Wiseplay
</button>

<button onclick="toggleFullscreen()">
Fullscreen
</button>

</div>

<div class="status" id="status">
Ready
</div>

<div class="channel-grid">

<div class="channel"
onclick="playChannel(
'https://raw.githubusercontent.com/123testhub/all/refs/heads/main/hbo.m3u8'
)">

<img
src="https://upload.wikimedia.org/wikipedia/commons/d/de/HBO_logo.svg"
onerror="this.src='https://via.placeholder.com/70'"
>

<div class="channel-name">
HBO
</div>

</div>

<div class="channel"
onclick="playChannel(
'https://raw.githubusercontent.com/123testhub/all/refs/heads/main/spotv1.m3u8'
)">

<img
src="https://upload.wikimedia.org/wikipedia/commons/2/2f/SPOTV_logo.png"
onerror="this.src='https://via.placeholder.com/70'"
>

<div class="channel-name">
SPOTV 1
</div>

</div>

<div class="channel"
onclick="playChannel(
'https://love.pifipa2974.workers.dev/lx-origin/streamx-samrujlok_480/chunks.m3u8'
)">

<img
src="https://ais-s.ais-vidnt.com/ais/play/origin/LIVE//channelicon///SamRujLok.png"
onerror="this.src='https://via.placeholder.com/70'"
>

<div class="channel-name">
สำรวจโลก
</div>

</div>

<div class="channel"
onclick="playChannel(
'https://ssai-streaming.thairath.co.th/bamm-csai/720p/index.m3u8'
)">

<img
src="https://ais-s.ais-vidnt.com/ais/play/origin/LIVE/channelicon/0016.png"
onerror="this.src='https://via.placeholder.com/70'"
>

<div class="channel-name">
ไทยรัฐ
</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://unpkg.com/plyr@3"></script>

<script>

const video = document.getElementById('video');
const customUrl = document.getElementById('customUrl');
const statusText = document.getElementById('status');

let currentUrl = '';
let hls;

const player = new Plyr(video);

function setStatus(text){
    statusText.innerText = text;
}

function destroyPlayer(){

    if(hls){
        hls.destroy();
    }

}

function playChannel(url){

    currentUrl = url;

    customUrl.value = url;

    destroyPlayer();

    setStatus('Loading...');

    if(Hls.isSupported()){

        hls = new Hls({
            enableWorker:true,
            lowLatencyMode:true
        });

        hls.loadSource(url);

        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED,function(){

            video.play();

            setStatus('Playing');

        });

        hls.on(Hls.Events.ERROR,function(event,data){

            console.log(data);

            if(data.fatal){

                setStatus('Stream Error');

            }

        });

    }else if(video.canPlayType('application/vnd.apple.mpegurl')){

        video.src = url;

        video.play();

    }else{

        alert('Browser ไม่รองรับ HLS');

    }

}

function loadCustom(){

    const url = customUrl.value.trim();

    if(!url){
        return;
    }

    playChannel(url);

}

function openMX(){

    if(!currentUrl){
        alert('เลือกช่องก่อน');
        return;
    }

    const cleanUrl = currentUrl
        .replace('https://','')
        .replace('http://','');

    const intent =
`intent://${cleanUrl}
#Intent;
package=com.mxtech.videoplayer.ad;
type=application/x-mpegURL;
end`;

    window.location.href = intent;

}

function openWiseplay(){

    if(!currentUrl){
        alert('เลือกช่องก่อน');
        return;
    }

    const intent =
`wiseplay://${encodeURIComponent(currentUrl)}`;

    window.location.href = intent;

}

async function toggleFullscreen(){

    if(!document.fullscreenElement){

        await video.requestFullscreen();

    }else{

        await document.exitFullscreen();

    }

}

playChannel(
'https://raw.githubusercontent.com/123testhub/all/refs/heads/main/hbo.m3u8'
);

</script>

</body>
</html>
