<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV MAS - Auto Playlist</title>
    <link rel="stylesheet" href="https://unpkg.com/plyr@3/dist/plyr.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --bg: #0f172a; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Kanit', sans-serif; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; padding: 15px; width: 100%; background: rgba(0,0,0,0.3); }
        .container { width: 95%; max-width: 800px; margin-top: 15px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; }
        .video-box { border-radius: 15px; overflow: hidden; background: #000; }
        select { width: 100%; padding: 12px; margin-top: 15px; border-radius: 10px; background: #1e293b; color: white; border: 1px solid #334155; font-family: 'Kanit'; }
        .btn-group { display: flex; gap: 8px; margin-top: 15px; justify-content: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; background: #334155; color: white; cursor: pointer; }
        .btn-blue { background: #0ea5e9; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0; font-size: 1.2rem; color: var(--primary);">IPTV AUTO PLAYLIST</h1>
    <div id="status" style="font-size: 0.7rem; color: #10b981;">กำลังโหลดรายการช่อง...</div>
</div>

<div class="container">
    <div class="video-box">
        <video id="player" playsinline controls crossorigin></video>
    </div>

    <!-- รายการช่องจะถูกเติมเข้าที่นี่อัตโนมัติ -->
    <select id="channelList">
        <option value="">-- เลือกช่องรายการจากไฟล์ M3U --</option>
    </select>

    <div class="btn-group">
        <button class="btn" onclick="resizeVideo('fill')">Stretch</button>
        <button class="btn" onclick="resizeVideo('contain')">Reset</button>
        <button class="btn btn-blue" id="fullBtn">เต็มจอ</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://unpkg.com/plyr@3"></script>

<script>
    const video = document.getElementById('player');
    const channelList = document.getElementById('channelList');
    const statusText = document.getElementById('status');
    const player = new Plyr(video);

    // 1. ดึงข้อมูลจากไฟล์ .m3u ในเครื่อง/GitHub ของคุณ
    async function loadM3U() {
        try {
            // ดึงไฟล์ชื่อ all_channels.m3u ที่อยู่ในโฟลเดอร์เดียวกัน
            const response = await fetch('all_channels.m3u'); 
            const data = await text = await response.text();
            parseM3U(data);
            statusText.textContent = "โหลดช่องรายการสำเร็จ!";
        } catch (error) {
            statusText.textContent = "โหลดไฟล์ M3U ไม่สำเร็จ";
            console.error(error);
        }
    }

    // 2. แปลงข้อมูล M3U เป็นรายการเลือก (Option)
    function parseM3U(data) {
        const lines = data.split('\n');
        let currentName = '';

        lines.forEach(line => {
            line = line.trim();
            if (line.startsWith('#EXTINF:')) {
                // หาชื่อช่องหลังเครื่องหมายคอมม่า (,)
                currentName = line.split(',')[1] || "Unknown Channel";
            } else if (line.startsWith('http')) {
                // ถ้าเป็นบรรทัดลิงก์ ให้สร้าง Option
                const option = document.createElement('option');
                option.value = line;
                option.textContent = currentName;
                channelList.appendChild(option);
            }
        });
    }

    // 3. ฟังก์ชันเล่นวิดีโอ
    function playStream(url) {
        if (!url) return;
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
        } else {
            video.src = url;
        }
        video.play();
    }

    channelList.addEventListener('change', (e) => playStream(e.target.value));

    // ปุ่มเต็มจอ
    document.getElementById('fullBtn').addEventListener('click', () => {
        if (player.fullscreen.enabled) player.fullscreen.enter();
    });

    function resizeVideo(mode) {
        video.style.objectFit = mode;
    }

    // เริ่มโหลดไฟล์ M3U เมื่อเปิดหน้าเว็บ
    loadM3U();
</script>

</body>
</html>
