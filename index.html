<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV MAS PREMIERE</title>
    
    <!-- CSS สำหรับเครื่องเล่นและฟอนต์ -->
    <link rel="stylesheet" href="https://unpkg.com/plyr@3/dist/plyr.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00d2ff;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: white;
            font-family: 'Kanit', sans-serif;
            display: flex; flex-direction: column; align-items: center;
        }

        .header {
            text-align: center; padding: 20px; width: 100%;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
        }

        .container {
            width: 95%; max-width: 800px; margin-top: 20px;
            background: var(--glass); padding: 15px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* ปรับปรุงส่วน Video */
        .video-box {
            border-radius: 15px; overflow: hidden; background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video { width: 100%; height: auto; }

        .ui-controls {
            display: grid; gap: 15px; margin-top: 20px;
        }

        select, input {
            width: 100%; padding: 12px; border-radius: 10px;
            background: #1e293b; color: white; border: 1px solid #334155;
            font-family: 'Kanit';
        }

        .btn-group {
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
        }

        .btn {
            padding: 10px 15px; border: none; border-radius: 8px;
            cursor: pointer; font-family: 'Kanit'; transition: 0.2s;
            background: #334155; color: white; font-size: 14px;
        }

        .btn-blue { background: #0ea5e9; }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0; font-size: 1.2rem; color: var(--primary);">IPTV MAS PREMIERE</h1>
    <div id="clock" style="font-size: 0.8rem; opacity: 0.7; margin-top: 5px;"></div>
</div>

<div class="container">
    <div class="video-box">
        <!-- ใส่ ID วิดีโอให้ตรงกับสคริปต์ -->
        <video id="player" playsinline controls crossorigin></video>
    </div>

    <div class="ui-controls">
        <!-- รายการช่องทั้งหมดที่คุณเคยมี -->
        <select id="channelList">
            <option value="">-- เลือกช่องรายการ --</option>
            <option value="https://love.pifipa2974.workers.dev/lx-origin/streamx-samrujlok_480/chunks.m3u8">สำรวจโลก</option>
            <option value="https://monomax-uiripn.cdn.byteark.com/plain/th/1080p/index.m3u8">โมโน 29</option>
            <option value="http://45.144.166.242:1935/ThairathTV/t3_thairathtv/playlist.m3u8">ไทยรัฐ ทีวี</option>
            <option value="https://load1.v2h-cdn.com/digitaltv/ch3/playlist.m3u8">ช่อง 3HD</option>
            <option value="https://load1.v2h-cdn.com/RE_freetv/7HD.stream_720p/playlist.m3u8">ช่อง 7HD</option>
            <option value="https://lb1-live-mv.v2h-cdn.com/hls/ffad/vibomi/vibomi.m3u8">อมรินทร์ ทีวี</option>
        </select>

        <div style="display: flex; gap: 5px;">
            <input type="text" id="manualUrl" placeholder="วางลิงก์ .m3u8 เองที่นี่">
            <button class="btn btn-blue" id="playBtn">เล่น</button>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="resizeVideo('fill')">Stretch</button>
            <button class="btn" onclick="resizeVideo('cover')">Crop</button>
            <button class="btn" onclick="resizeVideo('contain')">Reset</button>
            <button class="btn btn-blue" id="fullBtn">เต็มจอ</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://unpkg.com/plyr@3"></script>

<script>
    const video = document.getElementById('player');
    const channelList = document.getElementById('channelList');
    const manualUrl = document.getElementById('manualUrl');
    const playBtn = document.getElementById('playBtn');
    
    // ตั้งค่าตัวเล่น Plyr
    const player = new Plyr(video);

    function loadVideo(url) {
        if (!url) return;
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
        } else {
            video.src = url;
        }
        video.play();
    }

    // แก้ไขปุ่มกดไม่ได้
    channelList.addEventListener('change', (e) => loadVideo(e.target.value));
    playBtn.addEventListener('click', () => loadVideo(manualUrl.value));
    
    // ปุ่มเต็มจอ
    document.getElementById('fullBtn').addEventListener('click', () => {
        if (player.fullscreen.enabled) player.fullscreen.enter();
    });

    // ปุ่มปรับสัดส่วนภาพ
    function resizeVideo(mode) {
        video.style.objectFit = mode;
    }

    // นาฬิกา
    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').textContent = now.toLocaleString('th-TH');
    }, 1000);
</script>

</body>
</html>
