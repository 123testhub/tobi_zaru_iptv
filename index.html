<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Test Port 2095</title>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; }
        video { width: 100%; max-width: 600px; background: #222; margin-top: 20px; }
        select { padding: 10px; margin-top: 20px; width: 80%; }
        .warning { color: #ff4d4d; font-size: 0.8rem; padding: 10px; }
    </style>
</head>
<body>

    <h2>ทดสอบลิงก์ตรง (Port 2095)</h2>
    <p class="warning">** หากกดเล่นแล้วจอมืด แสดงว่าบราวเซอร์บล็อก HTTP/Port **</p>

    <video id="testPlayer" controls playsinline></video>

    <br>
    <select id="linkSelector">
        <option value="">-- เลือกช่องเพื่อทดสอบ --</option>
        <!-- ลิงก์ที่ 1: ดึงจากบรรทัดบนในภาพ 19386.jpg -->
        <option value="http://ultratv.one:2095/live/hCPtsREFtA/Xj25tg0ZXi/115704.m3u8">HBO Test 1 (115704)</option>
        <!-- ลิงก์ที่ 2: ดึงจากบรรทัดล่างในภาพ 19386.jpg -->
        <option value="http://ultratv.one:2095/live/hCPtsREFtA/Xj25tg0ZXi/115714.m3u8">HBO Test 2 (115714)</option>
    </select>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const video = document.getElementById('testPlayer');
        const selector = document.getElementById('linkSelector');

        selector.addEventListener('change', (e) => {
            const url = e.target.value;
            if (!url) return;

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = url;
                video.play();
            }
        });
    </script>
</body>
</html>
